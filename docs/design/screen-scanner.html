<!-- @dsCard group="Screens" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sello — Scanner del empleado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEDE4; --paper-2:#E5E2D6; --ink:#191814; --ink-2:#56534A; --faint:#918C7E;
    --line:#CBC7B8; --spot:#9E3B2B;
    --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
  }
  *{box-sizing:border-box}
  body{margin:0;background:#D7D3C6;font-family:"Hanken Grotesk",sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:30px}
  .phone{width:390px;background:var(--ink);border-radius:30px;padding:12px}
  .screen{background:var(--paper);border-radius:22px;overflow:hidden;position:relative;min-height:720px}
  .screen::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.035;mix-blend-mode:multiply;pointer-events:none;z-index:9}
  .bar{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink)}
  .bar .l{display:flex;align-items:center;gap:10px}
  .bar .mk{width:28px;height:28px;border:1px solid var(--ink);border-radius:3px;display:grid;place-items:center;font-family:"Fraunces",serif;font-weight:600;font-size:15px}
  .bar .t{font-family:"Fraunces",serif;font-weight:600;font-size:16px}
  .bar .who{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint)}

  .cam{height:290px;background:#14110d;position:relative;display:grid;place-items:center}
  .reticle{width:188px;height:188px;position:relative}
  .reticle span{position:absolute;width:30px;height:30px;border:2px solid var(--paper)}
  .reticle .tl{top:0;left:0;border-right:0;border-bottom:0}
  .reticle .tr{top:0;right:0;border-left:0;border-bottom:0}
  .reticle .bl{bottom:0;left:0;border-right:0;border-top:0}
  .reticle .br{bottom:0;right:0;border-left:0;border-top:0}
  .scanline{position:absolute;left:4px;right:4px;height:2px;background:var(--spot);top:30px;animation:scan 2.2s ease-in-out infinite}
  @keyframes scan{0%,100%{top:12px}50%{top:174px}}
  .camtip{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#E8DECB;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em}

  .pad{padding:18px}
  .mh{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--ink)}
  .mh .av{width:42px;height:42px;border:1px solid var(--ink);border-radius:999px;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px}
  .mh .nm{font-family:"Fraunces",serif;font-weight:600;font-size:19px;line-height:1}
  .mh .meta{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--faint);margin-top:4px}
  .mh .pb{margin-left:auto;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:16px;color:var(--spot)}
  .dots{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 4px}
  .dot{width:24px;height:24px;border-radius:999px;display:grid;place-items:center}
  .dot.on{background:var(--spot);color:var(--paper)}
  .dot.on svg{width:55%;height:55%}
  .dot.off{border:1px dashed var(--line)}
  .dot.next{border:1px solid var(--spot)}

  .big{margin-top:16px;width:100%;border:1px solid var(--spot);border-radius:3px;background:var(--spot);color:var(--paper);font-family:"Hanken Grotesk";font-weight:700;font-size:17px;padding:16px;cursor:pointer;display:flex;gap:10px;justify-content:center;align-items:center}
  .big svg{width:20px;height:20px}
  .row2{display:flex;gap:10px;margin-top:10px}
  .row2 button{flex:1;border:1px solid var(--ink);background:transparent;border-radius:3px;padding:12px;font-family:"Hanken Grotesk";font-weight:600;font-size:13.5px;color:var(--ink);cursor:pointer}
  .hintbar{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);text-align:center;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint)}
  .hintbar b{color:var(--spot);font-weight:700}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="bar">
      <div class="l"><div class="mk">S</div><div class="t">Scanner</div></div>
      <div class="who">caja · flor</div>
    </div>

    <div class="cam">
      <div class="reticle"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span><div class="scanline"></div></div>
      <div class="camtip">apuntá al código del cliente</div>
    </div>

    <div class="pad">
      <div class="mh">
        <div class="av">SM</div>
        <div><div class="nm">Sofía Martínez</div><div class="meta">#A4F9-21 · Sellos ·pote</div></div>
        <div class="pb">7/10</div>
      </div>
      <div class="dots">
        <span class="dot on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.3L21 9l-5 4.2L17.5 20 12 16.4 6.5 20 8 13.2 3 9l6.4-.7z"/></svg></span>
        <span class="dot on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.3L21 9l-5 4.2L17.5 20 12 16.4 6.5 20 8 13.2 3 9l6.4-.7z"/></svg></span>
        <span class="dot on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.3L21 9l-5 4.2L17.5 20 12 16.4 6.5 20 8 13.2 3 9l6.4-.7z"/></svg></span>
        <span class="dot on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.3L21 9l-5 4.2L17.5 20 12 16.4 6.5 20 8 13.2 3 9l6.4-.7z"/></svg></span>
        <span class="dot on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.3L21 9l-5 4.2L17.5 20 12 16.4 6.5 20 8 13.2 3 9l6.4-.7z"/></svg></span>
        <span class="dot on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.3L21 9l-5 4.2L17.5 20 12 16.4 6.5 20 8 13.2 3 9l6.4-.7z"/></svg></span>
        <span class="dot on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.3L21 9l-5 4.2L17.5 20 12 16.4 6.5 20 8 13.2 3 9l6.4-.7z"/></svg></span>
        <span class="dot next"></span><span class="dot off"></span><span class="dot off"></span>
      </div>

      <button class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>Sumar 1 sello</button>
      <div class="row2"><button>Sumar 2</button><button>Canjear premio</button></div>
      <p class="hintbar">última acción · <b>+1 sello a Juan P.</b> · hace 2 min</p>
    </div>
  </div>
</div>
</body>
</html>
